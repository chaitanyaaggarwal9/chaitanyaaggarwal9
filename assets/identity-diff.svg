<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chaitanya Aggarwal, Product Manager, AI and LLM products" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#151b23"/>
    </linearGradient>
    <clipPath id="rounded"><rect x="0" y="0" width="900" height="300" rx="14" ry="14"/></clipPath>
    <pattern id="scanPattern" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.5" fill="#ffffff"/>
    </pattern>
  </defs>

  <g clip-path="url(#rounded)">
    <rect x="0" y="0" width="900" height="300" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="900" height="300" fill="url(#scanPattern)" opacity="0.05"/>

    <!-- slow scanning sweep -->
    <rect x="0" y="-60" width="900" height="60" fill="#58a6ff" opacity="0.05">
      <animate attributeName="y" values="-60;300" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- window chrome -->
    <circle cx="26" cy="26" r="6" fill="#f85149"/>
    <circle cx="46" cy="26" r="6" fill="#d29922"/>
    <circle cx="66" cy="26" r="6" fill="#3fb950"/>
    <text x="88" y="31" font-family="Consolas, 'SF Mono', 'Fira Code', monospace" font-size="13" fill="#6e7681">identity.diff — chaitanya@github ~ %</text>

    <!-- live indicator, always on -->
    <circle cx="862" cy="26" r="5" fill="#3fb950">
      <animate attributeName="opacity" values="1;1;0.35;1" keyTimes="0;0.5;0.75;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="850" y="31" font-family="Consolas, monospace" font-size="12" fill="#3fb950" text-anchor="end">LIVE</text>

    <!-- glitch flash bars, rare -->
    <rect x="0" y="66" width="900" height="3" fill="#ff2d78" opacity="0">
      <animate attributeName="opacity" values="0;0;0.65;0;0" keyTimes="0;0.55;0.585;0.62;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="210" width="900" height="2" fill="#39d0ff" opacity="0">
      <animate attributeName="opacity" values="0;0;0.55;0;0" keyTimes="0;0.56;0.6;0.63;1" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- diff header -->
    <text x="40" y="72" font-family="Consolas, monospace" font-size="14" fill="#6e7681">--- a/identity.txt</text>
    <text x="40" y="92" font-family="Consolas, monospace" font-size="14" fill="#6e7681">+++ b/identity.txt</text>
    <text x="40" y="114" font-family="Consolas, monospace" font-size="14" fill="#a371f7">@@ -1,4 +1,4 @@ career.evolve()</text>

    <!-- removed lines: hidden by default, brief flash only -->
    <g fill="#f85149" font-family="Consolas, monospace" font-size="15" opacity="0">
      <text x="40" y="144">- title: Business Analyst</text>
      <text x="40" y="166">- domain: concrete, spreadsheets, on-site fixes</text>
      <text x="40" y="188">- status: figuring it out</text>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.55;0.585;0.62;1" dur="8s" repeatCount="indefinite"/>
    </g>

    <!-- added lines: visible by default (this is the real, current info) -->
    <g fill="#3fb950" font-family="Consolas, monospace" font-size="15" opacity="1">
      <text x="40" y="144">+ title: Product Manager, AI / LLM Products</text>
      <text x="40" y="166">+ domain: 0→1 · FinTech · EdTech · shipped, live, real users</text>
      <text x="40" y="188">+ status: shipping</text>
      <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.55;0.585;0.62;1" dur="8s" repeatCount="indefinite"/>
    </g>

    <!-- cursor -->
    <rect x="40" y="200" width="9" height="16" fill="#58a6ff">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- name: stable text always visible, ghost RGB copies flash briefly -->
    <g font-family="Consolas, 'SF Mono', 'Fira Code', monospace" font-weight="700" font-size="30">
      <text x="40" y="252" fill="#ff2d78" opacity="0">
        <animate attributeName="opacity" values="0;0;0.6;0;0" keyTimes="0;0.55;0.585;0.62;1" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="x" values="40;40;36;40;40" keyTimes="0;0.55;0.585;0.62;1" dur="8s" repeatCount="indefinite"/>
        CHAITANYA AGGARWAL
      </text>
      <text x="40" y="252" fill="#39d0ff" opacity="0">
        <animate attributeName="opacity" values="0;0;0.6;0;0" keyTimes="0;0.55;0.585;0.62;1" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="x" values="40;40;44;40;40" keyTimes="0;0.55;0.585;0.62;1" dur="8s" repeatCount="indefinite"/>
        CHAITANYA AGGARWAL
      </text>
      <text x="40" y="252" fill="#e6edf3">CHAITANYA AGGARWAL</text>
    </g>
    <text x="40" y="278" font-family="Consolas, monospace" font-size="14" fill="#8b949e">patch 4/4 applied · 8y uptime · 0 unresolved TODOs</text>
  </g>
</svg>
